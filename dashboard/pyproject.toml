[project]
name = "tradingagents-dashboard"
version = "0.1.0"
description = "Web dashboard to launch TradingAgents runs and view live agent progress and historical decisions."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0",
    "sse-starlette>=2.1",
    "tradingagents",
]

[tool.uv.sources]
tradingagents = { path = "../TradingAgents", editable = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
