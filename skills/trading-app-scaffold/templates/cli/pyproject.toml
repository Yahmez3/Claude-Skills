[project]
name = "trading-cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pandas>=2.2",
    "yfinance>=0.2.40",
    "numpy>=1.26",
]

[project.scripts]
trade = "trading_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
