[project]
name = "trading-backend"
version = "0.1.0"
description = "FastAPI trading backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "pandas>=2.2",
    "yfinance>=0.2.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
